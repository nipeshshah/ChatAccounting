<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
<meta name="theme-color" content="#0B192C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chat Accountant</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">

<!-- Fonts (Google Fonts) -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- Icons (Phosphor, vendored) -->
<link rel="stylesheet" href="assets/vendor/phosphor/regular/style.css">
<link rel="stylesheet" href="assets/vendor/phosphor/bold/style.css">

<!-- Styles: Tailwind utilities (generated — npm run build:css), then our own files -->
<link rel="stylesheet" href="css/tailwind.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/touch.css">
<link rel="stylesheet" href="css/fullscreen.css">
<link rel="stylesheet" href="css/documents.css">
<link rel="stylesheet" href="css/print.css">

<!-- Environment: data provider + keys -->
<script src="js/config.js"></script>
</head>
<body class="font-sans text-slate-800 antialiased selection:bg-fintech-blue selection:text-white flex justify-center app-min-h bg-[#070F1C]">

<div class="app-frame w-full max-w-[430px] flex flex-col shadow-2xl relative bg-slate-50 border-x border-slate-200/80 overflow-hidden">

  <div data-include="partials/header.html"></div>

  <div id="pages" class="flex-1 min-h-0 flex flex-col">
    <div data-include="partials/pages/chat.html"></div>
    <div data-include="partials/pages/manage.html"></div>
    <div data-include="partials/pages/reporting.html"></div>
    <div data-include="partials/pages/requests.html"></div>
    <div data-include="partials/pages/profile.html"></div>
    <div data-include="partials/pages/settings.html"></div>
  </div>

  <div data-include="partials/nav.html"></div>
  <div data-include="partials/undo-toast.html"></div>

  <!-- Full-frame screens (stacked above the app) -->
  <div data-include="partials/screens/splash.html"></div>
  <div data-include="partials/screens/lock.html"></div>
  <div data-include="partials/screens/login.html"></div>
</div>

<!-- Printable document target. Hidden on screen; while printing it is the ONLY thing on the page
     (see css/print.css). Kept outside .app-frame so no app layout can clip it. -->
<div id="printArea" class="doc-root"></div>

<noscript><p style="padding:24px;font-family:sans-serif">Chat Accountant needs JavaScript.</p></noscript>
<script src="js/loader.js"></script>
</body>
</html>
