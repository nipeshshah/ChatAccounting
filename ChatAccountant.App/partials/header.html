  <header id="appHeader" class="shrink-0 z-40 bg-corporate-navy text-white shadow-lg border-b border-corporate-subtle safe-top">
    <div id="hdrInner" class="px-3 pt-1 pb-2 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div id="hdrLogo" class="relative w-8 h-8 rounded-lg bg-gradient-to-tr from-fintech-blueDark via-fintech-blue to-fintech-cyan flex items-center justify-center shadow-md shadow-blue-900/40 border border-blue-400/30">
          <img src="assets/images/logo-glyph.png" alt="" class="w-5 h-5">
          <span class="absolute -top-1 -right-1 w-3 h-3 rounded-full bg-emerald-500 border-2 border-corporate-navy flex items-center justify-center">
            <span class="w-1 h-1 rounded-full bg-white"></span>
          </span>
        </div>
        <div>
          <div class="flex items-center gap-1.5">
            <h1 class="text-[15px] font-bold tracking-tight text-white leading-tight">Chat Accountant</h1>
            <span id="hdrPro" class="inline-flex items-center px-1.5 py-0.5 rounded-full text-[9px] font-extrabold uppercase tracking-wider bg-fintech-blue/20 text-blue-300 border border-blue-500/40">PRO</span>
            <span id="hdrDot" title="Sync status" style="background:#34d399"></span>
          </div>
          <div id="hdrSync" class="flex items-center gap-1.5 mt-0.5">
            <span class="relative flex h-1.5 w-1.5">
              <span id="syncPing" class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75" style="background:#34d399"></span>
              <span id="syncDot" class="relative inline-flex rounded-full h-1.5 w-1.5" style="background:#34d399"></span>
            </span>
            <p class="text-[11px] font-medium text-slate-400 flex items-center gap-1 tracking-tight">
              <span id="syncText">Connecting…</span>
            </p>
          </div>
        </div>
      </div>
      <button id="hdrExit" type="button" title="Exit full screen" aria-label="Exit full screen" class="h-6 w-6 items-center justify-center rounded-md bg-corporate-subtle/90 hover:bg-corporate-surface text-slate-300 hover:text-white border border-slate-700/60 transition"><i class="ph-bold ph-corners-in text-sm"></i></button>
      <div id="hdrActions" class="flex items-center gap-1">
        <button id="btnExport" aria-label="Export CSV" class="h-7 w-7 flex items-center justify-center rounded-lg bg-corporate-subtle/90 hover:bg-corporate-surface active:bg-blue-600/30 text-slate-300 hover:text-white border border-slate-700/60 transition shadow-sm" type="button">
          <i class="ph ph-file-csv text-base"></i>
        </button>
        <button id="btnReset" aria-label="Reset all data" class="h-7 w-7 flex items-center justify-center rounded-lg bg-corporate-subtle/90 hover:bg-corporate-surface active:bg-blue-600/30 text-slate-300 hover:text-white border border-slate-700/60 transition shadow-sm" type="button">
          <i class="ph ph-arrows-clockwise text-base"></i>
        </button>
      </div>
    </div>
  </header>
